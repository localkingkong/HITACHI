<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vacuum Log Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1/dist/chartjs-plugin-zoom.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <style>
    ::-webkit-scrollbar { width:8px; height:8px; }
    ::-webkit-scrollbar-track { background:#f1f5f9; }
    ::-webkit-scrollbar-thumb { background:#cbd5e1; border-radius:4px; }
    #chartScrollContainer::-webkit-scrollbar { height:12px; }
    .custom-checkbox { accent-color:currentColor; }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 h-screen flex flex-col overflow-hidden font-sans">
<header class="bg-white border-b border-gray-200 p-3 flex items-center justify-between shrink-0 shadow-sm">
  <div class="flex items-center space-x-4">
    <h1 class="text-xl font-bold text-blue-600">Vacuum Analyzer</h1>
    <div class="h-6 w-px bg-gray-300"></div>
    <label class="cursor-pointer bg-blue-600 hover:bg-blue-700 text-white px-3 py-1.5 rounded text-sm font-semibold">GT2000E<input type="file" id="fileInputGT2000E" accept=".txt,.csv" class="hidden"></label>
    <label class="cursor-pointer bg-teal-600 hover:bg-teal-700 text-white px-3 py-1.5 rounded text-sm font-semibold">CG7300<input type="file" id="fileInputCG7300" accept=".txt,.csv" class="hidden"></label>
    <span id="fileNameDisplay" class="text-gray-500 text-sm font-medium">No file loaded (Demo Mode)</span>
  </div>
  <button id="btnResetZoom" class="bg-white hover:bg-gray-50 text-gray-700 px-3 py-1.5 rounded text-sm font-semibold border border-gray-300">Reset Zoom</button>
</header>

<div class="flex flex-1 min-h-0 overflow-hidden">
<main class="flex-1 flex flex-col min-w-0 border-r border-gray-200 bg-white">
  <section class="bg-gray-50 border-b border-gray-200 p-3 shrink-0 font-mono text-sm leading-relaxed whitespace-nowrap overflow-x-auto shadow-sm">
    <div id="dataHover" class="text-blue-700 font-semibold">[Hover] ----</div>
    <div id="dataPinned" class="text-purple-700 font-semibold mt-1">[Pinned] ----</div>
  </section>

  <div class="flex-1 relative pt-4 px-4 pb-1 bg-white flex flex-col min-h-0">
    <div class="flex-1 relative min-h-0"><canvas id="vacuumChart"></canvas></div>
    <div id="tmpTracks" class="shrink-0 border-t border-gray-200 mt-1 bg-slate-50 font-mono text-[11px]">
      <canvas id="tmpCanvas" height="78" class="w-full block"></canvas>
    </div>
    <div id="chartScrollContainer" class="w-full overflow-x-auto overflow-y-hidden mt-1"><div id="chartScrollContent" class="h-[1px] w-full"></div></div>
  </div>
  <div id="loadingOverlay" class="absolute inset-0 bg-white/90 flex items-center justify-center hidden z-40"><div class="text-blue-600 text-lg font-bold">Parsing Data...</div></div>
</main>

<aside class="w-72 bg-gray-50 flex flex-col shrink-0 overflow-y-auto">
  <div class="p-4 border-b border-gray-200">
    <h2 class="text-sm font-bold text-gray-700 uppercase mb-3">Data Lines</h2>
    <div class="flex flex-col space-y-2 font-semibold text-sm">
      <label class="text-blue-600"><input type="checkbox" id="toggleSC" checked class="custom-checkbox mr-2">SC</label>
      <label class="text-emerald-600"><input type="checkbox" id="toggleLC" checked class="custom-checkbox mr-2">LC</label>
      <label id="labelCLM" class="text-amber-600"><input type="checkbox" id="toggleCLM" checked class="custom-checkbox mr-2">CLM <span id="clmStatusText" class="text-[10px] text-gray-400 hidden">(Unavailable in CG7300)</span></label>
    </div>
  </div>
  <div class="p-4 border-b border-gray-200">
    <h2 class="text-sm font-bold text-gray-700 uppercase mb-3">TMP Status</h2>
    <div class="space-y-2 text-sm">
      <label class="block"><input type="checkbox" id="toggleTMP12" checked class="custom-checkbox mr-2">TMP1/2 Track</label>
      <label class="block"><input type="checkbox" id="toggleTMP3" checked class="custom-checkbox mr-2">TMP3 Track</label>
    </div>
    <div class="mt-3 text-xs text-gray-500 leading-relaxed">
      Assumed state: 0=STOP, 1=ACCEL, 2=RUN, 8=DECEL<br>
      TMP1/2 is displayed as TMP-A / TMP-B until nibble-to-pump mapping is confirmed.
    </div>
  </div>
  <div class="p-4">
    <h2 class="text-sm font-bold text-gray-700 uppercase mb-3">Valve Markers</h2>
    <div class="flex flex-col space-y-4" id="valveFiltersContainer">
      <div class="filter-group"><div class="font-bold text-pink-600 text-sm border-b border-gray-200 pb-1 mb-2">AV2</div><div class="grid grid-cols-2 gap-2 text-xs font-medium text-gray-600">
        <label><input type="checkbox" class="valve-cb custom-checkbox mr-1" data-v="AV2" data-m="Open" data-ba="A" checked>Open(A)</label><label><input type="checkbox" class="valve-cb custom-checkbox mr-1" data-v="AV2" data-m="Open" data-ba="B">Open(B)</label>
        <label><input type="checkbox" class="valve-cb custom-checkbox mr-1" data-v="AV2" data-m="Close" data-ba="A" checked>Close(A)</label><label><input type="checkbox" class="valve-cb custom-checkbox mr-1" data-v="AV2" data-m="Close" data-ba="B">Close(B)</label>
      </div></div>
      <div class="filter-group"><div class="font-bold text-cyan-600 text-sm border-b border-gray-200 pb-1 mb-2">AV3</div><div class="grid grid-cols-2 gap-2 text-xs font-medium text-gray-600">
        <label><input type="checkbox" class="valve-cb custom-checkbox mr-1" data-v="AV3" data-m="Open" data-ba="A" checked>Open(A)</label><label><input type="checkbox" class="valve-cb custom-checkbox mr-1" data-v="AV3" data-m="Open" data-ba="B">Open(B)</label>
        <label><input type="checkbox" class="valve-cb custom-checkbox mr-1" data-v="AV3" data-m="Close" data-ba="A" checked>Close(A)</label><label><input type="checkbox" class="valve-cb custom-checkbox mr-1" data-v="AV3" data-m="Close" data-ba="B">Close(B)</label>
      </div></div>
      <div class="filter-group"><div class="font-bold text-orange-600 text-sm border-b border-gray-200 pb-1 mb-2">AV4</div><div class="grid grid-cols-2 gap-2 text-xs font-medium text-gray-600">
        <label><input type="checkbox" class="valve-cb custom-checkbox mr-1" data-v="AV4" data-m="Open" data-ba="A" checked>Open(A)</label><label><input type="checkbox" class="valve-cb custom-checkbox mr-1" data-v="AV4" data-m="Open" data-ba="B">Open(B)</label>
        <label><input type="checkbox" class="valve-cb custom-checkbox mr-1" data-v="AV4" data-m="Close" data-ba="A" checked>Close(A)</label><label><input type="checkbox" class="valve-cb custom-checkbox mr-1" data-v="AV4" data-m="Close" data-ba="B">Close(B)</label>
      </div></div>
      <div class="filter-group"><div class="font-bold text-emerald-600 text-sm border-b border-gray-200 pb-1 mb-2">AV5-1</div><div class="grid grid-cols-2 gap-2 text-xs font-medium text-gray-600">
        <label><input type="checkbox" class="valve-cb custom-checkbox mr-1" data-v="AV5-1" data-m="Open" data-ba="A" checked>Open(A)</label><label><input type="checkbox" class="valve-cb custom-checkbox mr-1" data-v="AV5-1" data-m="Open" data-ba="B">Open(B)</label>
        <label><input type="checkbox" class="valve-cb custom-checkbox mr-1" data-v="AV5-1" data-m="Close" data-ba="A" checked>Close(A)</label><label><input type="checkbox" class="valve-cb custom-checkbox mr-1" data-v="AV5-1" data-m="Close" data-ba="B">Close(B)</label>
      </div></div>
      <div class="filter-group"><div class="font-bold text-teal-600 text-sm border-b border-gray-200 pb-1 mb-2">AV5-2</div><div class="grid grid-cols-2 gap-2 text-xs font-medium text-gray-600">
        <label><input type="checkbox" class="valve-cb custom-checkbox mr-1" data-v="AV5-2" data-m="Open" data-ba="A" checked>Open(A)</label><label><input type="checkbox" class="valve-cb custom-checkbox mr-1" data-v="AV5-2" data-m="Open" data-ba="B">Open(B)</label>
        <label><input type="checkbox" class="valve-cb custom-checkbox mr-1" data-v="AV5-2" data-m="Close" data-ba="A" checked>Close(A)</label><label><input type="checkbox" class="valve-cb custom-checkbox mr-1" data-v="AV5-2" data-m="Close" data-ba="B">Close(B)</label>
      </div></div>
      <div class="filter-group"><div class="font-bold text-indigo-600 text-sm border-b border-gray-200 pb-1 mb-2">AV5-X</div><div class="grid grid-cols-2 gap-2 text-xs font-medium text-gray-600">
        <label><input type="checkbox" class="valve-cb custom-checkbox mr-1" data-v="AV5-X" data-m="Open" data-ba="A" checked>Open(A)</label><label><input type="checkbox" class="valve-cb custom-checkbox mr-1" data-v="AV5-X" data-m="Open" data-ba="B">Open(B)</label>
        <label><input type="checkbox" class="valve-cb custom-checkbox mr-1" data-v="AV5-X" data-m="Close" data-ba="A" checked>Close(A)</label><label><input type="checkbox" class="valve-cb custom-checkbox mr-1" data-v="AV5-X" data-m="Close" data-ba="B">Close(B)</label>
      </div></div>
      <div class="filter-group"><div class="font-bold text-yellow-600 text-sm border-b border-gray-200 pb-1 mb-2">LV</div><div class="grid grid-cols-2 gap-2 text-xs font-medium text-gray-600">
        <label><input type="checkbox" class="valve-cb custom-checkbox mr-1" data-v="LV" data-m="Open" data-ba="A" checked>Open(A)</label><label><input type="checkbox" class="valve-cb custom-checkbox mr-1" data-v="LV" data-m="Open" data-ba="B">Open(B)</label>
        <label><input type="checkbox" class="valve-cb custom-checkbox mr-1" data-v="LV" data-m="Close" data-ba="A" checked>Close(A)</label><label><input type="checkbox" class="valve-cb custom-checkbox mr-1" data-v="LV" data-m="Close" data-ba="B">Close(B)</label>
      </div></div>
      <div class="filter-group"><div class="font-bold text-violet-600 text-sm border-b border-gray-200 pb-1 mb-2">AV6</div><div class="grid grid-cols-2 gap-2 text-xs font-medium text-gray-600">
        <label><input type="checkbox" class="valve-cb custom-checkbox mr-1" data-v="AV6" data-m="Open" data-ba="A" checked>Open(A)</label><label><input type="checkbox" class="valve-cb custom-checkbox mr-1" data-v="AV6" data-m="Open" data-ba="B">Open(B)</label>
        <label><input type="checkbox" class="valve-cb custom-checkbox mr-1" data-v="AV6" data-m="Close" data-ba="A" checked>Close(A)</label><label><input type="checkbox" class="valve-cb custom-checkbox mr-1" data-v="AV6" data-m="Close" data-ba="B">Close(B)</label>
      </div></div>
      <div class="filter-group"><div class="font-bold text-purple-600 text-sm border-b border-gray-200 pb-1 mb-2">AV7</div><div class="grid grid-cols-2 gap-2 text-xs font-medium text-gray-600">
        <label><input type="checkbox" class="valve-cb custom-checkbox mr-1" data-v="AV7" data-m="Open" data-ba="A" checked>Open(A)</label><label><input type="checkbox" class="valve-cb custom-checkbox mr-1" data-v="AV7" data-m="Open" data-ba="B">Open(B)</label>
        <label><input type="checkbox" class="valve-cb custom-checkbox mr-1" data-v="AV7" data-m="Close" data-ba="A" checked>Close(A)</label><label><input type="checkbox" class="valve-cb custom-checkbox mr-1" data-v="AV7" data-m="Close" data-ba="B">Close(B)</label>
      </div></div>
    </div>
  </div>
</aside>
</div>

<script>
let globalData=[];
let chartInstance=null;
let pinnedRowData=null;
let currentMachineType='GT2000E';
let syncingScroll=false;

const ui={
 fileInputGT2000E:document.getElementById('fileInputGT2000E'),
 fileInputCG7300:document.getElementById('fileInputCG7300'),
 fileNameDisplay:document.getElementById('fileNameDisplay'),
 loadingOverlay:document.getElementById('loadingOverlay'),
 dataHover:document.getElementById('dataHover'),
 dataPinned:document.getElementById('dataPinned'),
 btnResetZoom:document.getElementById('btnResetZoom'),
 SC:document.getElementById('toggleSC'), LC:document.getElementById('toggleLC'), CLM:document.getElementById('toggleCLM'),
 TMP12:document.getElementById('toggleTMP12'), TMP3:document.getElementById('toggleTMP3'),
 labelCLM:document.getElementById('labelCLM'), clmStatusText:document.getElementById('clmStatusText')
};

const VALVE_COLORS={'AV2':'#db2777','AV3':'#0891b2','AV4':'#ea580c','AV5-1':'#059669','AV5-2':'#0d9488','AV5-X':'#4f46e5','LV':'#ca8a04','AV6':'#7c3aed','AV7':'#9333ea'};
const TMP_STATE={0:'STOP',1:'ACCEL',2:'RUN',8:'DECEL'};
const TMP_COLOR={STOP:'#cbd5e1',ACCEL:'#f59e0b',RUN:'#16a34a',DECEL:'#ef4444',UNKNOWN:'#94a3b8'};

function parsePressure(v){
 if(v===undefined||v===null||v==='')return NaN;
 const s=String(v).trim().toUpperCase();
 if(s.includes('OVERRNG')||s==='OVER')return 100000;
 if(s.includes('UNDRRNG')||s==='UNDER')return 1e-7;
 return parseFloat(v);
}
function cleanValve(v){
 if(!v)return '----';
 let s=String(v).replace(/_/g,'').trim().toUpperCase();
 if(s.includes('AV51'))return 'AV5-1';
 if(s.includes('AV52'))return 'AV5-2';
 if(s.includes('AV5X'))return 'AV5-X';
 if(s.startsWith('LV'))return s;
 return s||'----';
}
function cleanMode(v){
 if(!v)return '-----';
 const s=String(v).replace(/_/g,'').trim().toUpperCase();
 if(s.includes('OPEN')||s==='ON')return 'Open';
 if(s.includes('CLOS')||s.includes('SHUT')||s==='OFF')return 'Close';
 return s;
}
function cleanBA(v){
 if(v===undefined||v===null)return '-';
 const s=String(v).replace(/_/g,'').trim().toUpperCase();
 return (s==='A'||s==='B')?s:'-';
}
function normalizeHex(v){
 if(v===undefined||v===null||v==='')return null;
 if(typeof v==='number')return '0x'+Math.trunc(v).toString(16).padStart(2,'0').toUpperCase();
 let s=String(v).trim().toUpperCase();
 if(!s)return null;
 if(s.startsWith('0X'))return '0x'+s.slice(2).padStart(2,'0');
 const n=parseInt(s,16);
 return Number.isNaN(n)?s:'0x'+n.toString(16).padStart(2,'0').toUpperCase();
}
function decodeNibble(n){return TMP_STATE[n]||('0x'+n.toString(16).toUpperCase());}
function decodeTMP12(raw){
 const h=normalizeHex(raw); if(!h)return {raw:'---',a:'---',b:'---'};
 const n=parseInt(h.slice(2),16); if(Number.isNaN(n))return {raw:h,a:'?',b:'?'};
 return {raw:h,a:decodeNibble((n>>4)&15),b:decodeNibble(n&15)};
}
function decodeTMP3(raw){
 const h=normalizeHex(raw); if(!h)return {raw:'---',state:'---'};
 const n=parseInt(h.slice(2),16); return {raw:h,state:Number.isNaN(n)?'?':decodeNibble(n&15)};
}
function formatPressure(v){return v!==null&&!isNaN(v)?Number(v).toExponential(1).toUpperCase():'---';}
function formatDataString(prefix,row){
 if(!row)return `[${prefix}] ----`;
 const t12=decodeTMP12(row.TMP12), t3=decodeTMP3(row.TMP3);
 const acts=(row.actions||[]).map(a=>`${cleanValve(a.VALVE)} ${cleanMode(a.MODE)}(${cleanBA(a['B/A'])})`).join(', ')||'----';
 return `[${prefix}] ${row.Date||''} ${row.Time||''} | SC: ${formatPressure(row.SC_Pa)} | LC: ${formatPressure(row.LC_Pa)} | CLM: ${currentMachineType==='CG7300'?'N/A':formatPressure(row.CLM_Pa)} | TMP-A/B: ${t12.a}/${t12.b} [${t12.raw}] | TMP3: ${t3.state} [${t3.raw}] | VALVE: ${acts}`;
}

const valvePlugin={id:'valveMarkers',afterDraw(chart){
 const ctx=chart.ctx,x=chart.scales.x,y=chart.scales.y;
 const activeFilters=new Set([...document.querySelectorAll('.valve-cb:checked')].map(e=>`${e.dataset.v}_${e.dataset.m}_${e.dataset.ba}`));
 ctx.save();ctx.font='bold 10px Arial';ctx.textAlign='center';
 globalData.forEach((r,i)=>{
   if(!r.actions||!r.actions.length)return;
   const px=x.getPixelForValue(i); if(px<x.left||px>x.right)return;
   r.actions.forEach(a=>{
     const name=cleanValve(a.VALVE);
     let group=name.startsWith('LV')?'LV':name;
     const mode=cleanMode(a.MODE),ba=cleanBA(a['B/A']);
     let visible=activeFilters.has(`${group}_${mode}_${ba}`);
     if(ba==='-')visible=activeFilters.has(`${group}_${mode}_A`)||activeFilters.has(`${group}_${mode}_B`);
     if(!visible)return;
     const c=VALVE_COLORS[group]||'#64748b';
     ctx.strokeStyle=c;ctx.globalAlpha=.32;ctx.beginPath();ctx.moveTo(px,y.top);ctx.lineTo(px,y.bottom);ctx.stroke();
     ctx.globalAlpha=1;ctx.fillStyle=c;ctx.fillText(`${name} ${mode}(${ba})`,px,y.top+12);
   });
 });ctx.restore();
}};
Chart.register(valvePlugin);

function drawTMPTracks(){
 const canvas=document.getElementById('tmpCanvas'); const wrap=canvas.parentElement;
 const dpr=window.devicePixelRatio||1; const cssW=Math.max(300,wrap.clientWidth); const cssH=78;
 canvas.width=cssW*dpr; canvas.height=cssH*dpr; canvas.style.width=cssW+'px'; canvas.style.height=cssH+'px';
 const ctx=canvas.getContext('2d');ctx.scale(dpr,dpr);ctx.clearRect(0,0,cssW,cssH);
 if(!chartInstance||!globalData.length)return;
 const xScale=chartInstance.scales.x; const right=xScale.right;
 ctx.font='11px monospace';ctx.textBaseline='middle';ctx.fillStyle='#334155';
 const rows=[];if(ui.TMP12.checked){rows.push({label:'TMP-A',y:17,key:'a'});rows.push({label:'TMP-B',y:39,key:'b'});}if(ui.TMP3.checked)rows.push({label:'TMP3',y:61,key:'t3'});
 rows.forEach(r=>ctx.fillText(r.label,4,r.y));
 const labelW=52; const min=Math.max(0,Math.floor(xScale.min??0)), max=Math.min(globalData.length-1,Math.ceil(xScale.max??globalData.length-1));
 function stateAt(i,key){if(key==='t3')return decodeTMP3(globalData[i].TMP3).state;const d=decodeTMP12(globalData[i].TMP12);return d[key];}
 rows.forEach(r=>{
   let start=min,prev=stateAt(min,r.key);
   for(let i=min+1;i<=max+1;i++){
     const cur=i<=max?stateAt(i,r.key):'__END__';
     if(cur!==prev){
       const x1=Math.max(labelW,xScale.getPixelForValue(start)); const x2=Math.min(right,xScale.getPixelForValue(i));
       const color=TMP_COLOR[prev]||TMP_COLOR.UNKNOWN; ctx.fillStyle=color;ctx.globalAlpha=.78;ctx.fillRect(x1,r.y-8,Math.max(1,x2-x1),16);ctx.globalAlpha=1;
       if(x2-x1>42){ctx.fillStyle='#0f172a';ctx.textAlign='center';ctx.fillText(prev,(x1+x2)/2,r.y);ctx.textAlign='left';}
       start=i;prev=cur;
     }
   }
 });
 ctx.strokeStyle='#cbd5e1';ctx.beginPath();ctx.moveTo(labelW,0);ctx.lineTo(labelW,cssH);ctx.stroke();
}

function initChart(){
 const ctx=document.getElementById('vacuumChart').getContext('2d');
 chartInstance=new Chart(ctx,{type:'line',data:{labels:[],datasets:[]},options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},elements:{point:{radius:0,hitRadius:18,hoverRadius:4},line:{borderWidth:1.5,tension:0}},scales:{x:{ticks:{maxTicksLimit:15,color:'#64748b'},grid:{color:'#e2e8f0'}},y:{type:'logarithmic',position:'left',min:1e-7,max:1e5,title:{display:true,text:'SC / CLM'},ticks:{color:'#2563eb'}},y1:{type:'logarithmic',position:'right',min:1e-10,max:1e6,title:{display:true,text:'LC'},ticks:{color:'#059669'},grid:{drawOnChartArea:false}}},plugins:{legend:{display:false},tooltip:{enabled:false},zoom:{zoom:{wheel:{enabled:true,speed:.1},drag:{enabled:true},mode:'x',onZoom:()=>{updateScrollBar();drawTMPTracks();}},pan:{enabled:true,mode:'x',onPan:()=>{updateScrollBar();drawTMPTracks();}}}},onHover:(e,a)=>{if(a.length)ui.dataHover.innerText=formatDataString('Hover',globalData[a[0].index]);},onClick:(e,a)=>{if(a.length){pinnedRowData=globalData[a[0].index];ui.dataPinned.innerText=formatDataString('Pinned',pinnedRowData);}}}});
}
function renderChart(){
 if(!chartInstance)initChart();
 chartInstance.data.labels=globalData.map(r=>r.Time);
 chartInstance.data.datasets=[
  {label:'SC',data:globalData.map(r=>r.SC_Pa),borderColor:'#2563eb',yAxisID:'y',hidden:!ui.SC.checked},
  {label:'LC',data:globalData.map(r=>r.LC_Pa),borderColor:'#059669',yAxisID:'y1',hidden:!ui.LC.checked},
  {label:'CLM',data:currentMachineType==='CG7300'?globalData.map(()=>NaN):globalData.map(r=>r.CLM_Pa),borderColor:'#d97706',borderDash:[4,4],yAxisID:'y',hidden:!ui.CLM.checked}
 ];
 chartInstance.update();chartInstance.resetZoom();updateScrollBar();drawTMPTracks();
 if(globalData.length)ui.dataHover.innerText=formatDataString('Hover',globalData[0]);ui.dataPinned.innerText=formatDataString('Pinned',pinnedRowData);
}

function updateScrollBar(){
 if(!chartInstance||!globalData.length)return;
 const x=chartInstance.scales.x,total=globalData.length,min=Math.max(0,x.min??0),max=Math.min(total-1,x.max??total-1),visible=max-min+1;
 const cont=document.getElementById('chartScrollContainer'),content=document.getElementById('chartScrollContent');
 const ratio=visible/total;content.style.width=ratio>=.999?'100%':`${100/ratio}%`;
 if(!syncingScroll&&ratio<.999){const maxScroll=content.offsetWidth-cont.offsetWidth;cont.scrollLeft=(min/(total-visible))*maxScroll;}
}
document.getElementById('chartScrollContainer').addEventListener('scroll',e=>{
 if(!chartInstance||!globalData.length||syncingScroll)return;const cont=e.target,content=document.getElementById('chartScrollContent');const maxScroll=content.offsetWidth-cont.offsetWidth;if(maxScroll<=0)return;
 const total=globalData.length,x=chartInstance.scales.x,visible=(x.max??total-1)-(x.min??0)+1;const r=cont.scrollLeft/maxScroll;chartInstance.options.scales.x.min=r*(total-visible);chartInstance.options.scales.x.max=chartInstance.options.scales.x.min+visible-1;syncingScroll=true;chartInstance.update('none');drawTMPTracks();requestAnimationFrame(()=>syncingScroll=false);
});

function processParsedData(dataArray,machineType){
 let merged=[],last=null;
 dataArray.forEach(raw=>{
  const sc=parsePressure(raw.SC),lc=parsePressure(raw.LC),clm=raw.CLM!==undefined?parsePressure(raw.CLM):NaN;
  const SC_Pa=!isNaN(sc)?Math.max(sc,1e-7):null,LC_Pa=!isNaN(lc)?Math.max(lc,1e-7):null,CLM_Pa=!isNaN(clm)?Math.max(clm,1e-7):null;
  if(SC_Pa===null||LC_Pa===null)return;
  const rawValve=raw.VALVE!=null?String(raw.VALVE):'';const action=rawValve.trim()&&rawValve.trim()!=='____'?{VALVE:raw.VALVE,MODE:raw.MODE,'B/A':raw['B/A']}:null;
  const tmp12=raw['TMP1/2']??raw.TMP12??raw['TMP1_2']; const tmp3=raw.TMP3;
  if(last&&last.Time===raw.Time&&last.SC_Pa===SC_Pa&&last.LC_Pa===LC_Pa){if(action)last.actions.push(action);if(tmp12!==undefined&&tmp12!==null&&tmp12!=='')last.TMP12=tmp12;if(tmp3!==undefined&&tmp3!==null&&tmp3!=='')last.TMP3=tmp3;}
  else{last={Date:raw.Date,Time:raw.Time,SC_Pa,LC_Pa,CLM_Pa,actions:action?[action]:[],TMP12:tmp12,TMP3:tmp3};merged.push(last);}
 });
 let t12=null,t3=null;merged.forEach(r=>{if(r.TMP12!==undefined&&r.TMP12!==null&&r.TMP12!=='')t12=r.TMP12;else r.TMP12=t12;if(r.TMP3!==undefined&&r.TMP3!==null&&r.TMP3!=='')t3=r.TMP3;else r.TMP3=t3;});
 globalData=merged;pinnedRowData=null;renderChart();ui.loadingOverlay.classList.add('hidden');
}

function handleFileUpload(e,machineType){
 const file=e.target.files[0];if(!file)return;currentMachineType=machineType;ui.fileNameDisplay.innerText=`${file.name} (${machineType})`;ui.loadingOverlay.classList.remove('hidden');
 if(machineType==='CG7300'){ui.CLM.checked=false;ui.CLM.disabled=true;ui.labelCLM.classList.add('opacity-40');ui.clmStatusText.classList.remove('hidden');}else{ui.CLM.checked=true;ui.CLM.disabled=false;ui.labelCLM.classList.remove('opacity-40');ui.clmStatusText.classList.add('hidden');}
 const reader=new FileReader();reader.onload=ev=>{let lines=ev.target.result.split(/\r?\n/),header=0;for(let i=0;i<lines.length;i++){if(lines[i].includes('SC')&&lines[i].includes('LC')){header=i;break;}}let dl=lines.slice(header);if(dl.length&&!dl[0].includes(','))dl=dl.map(l=>l.trim().replace(/\s+/g,','));Papa.parse(dl.join('\n'),{header:true,skipEmptyLines:true,dynamicTyping:false,complete:r=>processParsedData(r.data,machineType),error:err=>{alert(err.message);ui.loadingOverlay.classList.add('hidden');}});};reader.readAsText(file);e.target.value='';
}

ui.fileInputGT2000E.addEventListener('change',e=>handleFileUpload(e,'GT2000E'));ui.fileInputCG7300.addEventListener('change',e=>handleFileUpload(e,'CG7300'));
[ui.SC,ui.LC,ui.CLM].forEach((cb,i)=>cb.addEventListener('change',()=>{if(chartInstance){chartInstance.data.datasets[i].hidden=!cb.checked;chartInstance.update();}}));
[ui.TMP12,ui.TMP3].forEach(cb=>cb.addEventListener('change',drawTMPTracks));document.querySelectorAll('.valve-cb').forEach(cb=>cb.addEventListener('change',()=>chartInstance&&chartInstance.update('none')));
ui.btnResetZoom.addEventListener('click',()=>{if(chartInstance){chartInstance.resetZoom();updateScrollBar();drawTMPTracks();}});window.addEventListener('resize',drawTMPTracks);

function generateMockData(){
 const mock=[];for(let i=0;i<120;i++){let s=i<20?'0x00':i<35?'0x11':i<45?'0x12':i<80?'0x22':i<100?'0x88':'0x00';let t=i<30?'0x00':i<45?'0x01':i<80?'0x02':i<100?'0x08':'0x00';mock.push({Date:'2026/09/29',Time:`00:${String(Math.floor(i/60)).padStart(2,'0')}:${String(i%60).padStart(2,'0')}`,SC:Math.max(1e-4,1e5*Math.pow(.85,i)),LC:Math.max(6e-5,1e5*Math.pow(.84,i)),CLM:Math.max(2e-5,1e5*Math.pow(.83,i)),'TMP1/2':s,TMP3:t,VALVE:i===20?'_AV6':'____',MODE:i===20?'_OPEN':'','B/A':'A'});}processParsedData(mock,'GT2000E');
}
window.onload=generateMockData;
</script>
